<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Connect — Student Management System</title>
  <link rel="stylesheet" href="style.css">
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-81CY3X9VGQ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('js', new Date());

  gtag('config', 'G-81CY3X9VGQ');
</script>

<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z" />
          </svg>
        </div>
        <div class="auth-logo-text">Campus<span>Connect</span></div>
      </div>
      <h2>Welcome back</h2>
      <p>Sign in to your account to continue</p>
      <div class="field">
        <label>Roll no.</label>
        <input type="number" id="login-rollno." placeholder="Enter your University roll no." />
      </div>
      <div class="field">
        <label>Password</label>
        <div class="pass-input-wrap">
          <input type="password" id="login-pass" placeholder="Enter your password" />
          <button type="button" class="pass-toggle-btn" id="pass-toggle-btn" onclick="togglePasswordVisibility()"
            aria-label="Show password">
            <svg id="pass-eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </div>
      <div class="field forgot-pass-row">
        <a href="javascript:void(0)" class="forgot-pass-link" onclick="forgotPassword()">Forgot password?</a>
      </div>
      <button class="btn-primary" id="login-btn" onclick="login()">
        <span id="login-btn-text">Sign In</span>
        <span id="login-btn-spinner" class="btn-spinner"></span>
      </button>
      <div id="login-error" style="color:var(--red);font-size:13px;margin-top:10px;display:none">Invalid credentials.
        Try a demo account below.</div>
      <div id="login-info" style="color:var(--green,#2f9e44);font-size:13px;margin-top:10px;display:none"></div>

    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app">
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-logo">CampusConnect</div>
        <div class="topbar-page" id="topbar-page">Dashboard</div>
      </div>
      <div class="topbar-right">
        <button class="notif-btn" onclick="navigate('notifications')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <span class="notif-badge" id="notif-count"></span>
        </button>
        <div class="user-chip">
          <div class="avatar" id="top-avatar" style="background:#3b5bdb">A</div>
          <div class="user-info">
            <div class="user-name" id="top-name">User</div>
            <div class="user-role" id="top-role">role</div>
          </div>
        </div>
        <button class="logout-btn" onclick="doLogout()">Sign out</button>
      </div>
    </div>

    <div class="main-layout">
      <nav class="sidebar" id="sidebar"></nav>
      <div class="content" id="main-content"></div>
    </div>
  </div>

  <div class="success-toast" id="toast"></div>

  //firebase link
  <script type="module" src="firebase.js"></script>

  <!-- PDF export libraries — used for "Download Attendance" (daily + full register) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  //javascript link
  <script src="script.js"></script>

</body>

</html>
